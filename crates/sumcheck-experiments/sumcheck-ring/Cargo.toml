[package]
name = "sumcheck-ring"
version = "0.1.0"
edition = "2021"

# Sumcheck protocol over GR(2^32, 128). Standalone — no shared trait with the
# field-side comparison crate, so the prover hot path is free to grow ring-
# specific optimizations (SIMD fold, batched mul-by-Teichmüller, etc.) without
# leaking irrelevant requirements onto a field backend.

[dependencies]
galois-ring = { path = "../../nenya/galois-ring" }
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sumcheck"
harness = false

[[bench]]
name = "forms"
harness = false
