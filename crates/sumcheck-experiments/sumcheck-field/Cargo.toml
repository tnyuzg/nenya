[package]
name = "sumcheck-field"
version = "0.1.0"
edition = "2021"

# Sumcheck protocol over BabyBear^4 (BinomialExtensionField<BabyBear, 4>).
# Reference / comparison side for `sumcheck-ring`. Same protocol shape, same
# round structure, same file layout — only the element type differs. The
# field-vs-ring overhead at equal num_vars reads off directly from the two
# bench tables.

[dependencies]
field = { path = "../../baseline/field" }
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "sumcheck"
harness = false
