[package]
name = "galois-ring"
version = "0.1.0"
edition = "2021"

[dependencies]
rand = "0.8"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
field = { path = "../../baseline/field" }

[[bench]]
name = "arithmetic"
harness = false

[[bench]]
name = "vs_babybear"
harness = false

# Full add/mul matrix: GR at u8/u16/u32/u64 (R0/R1/R2 levels) vs BabyBear^4.
[[bench]]
name = "field_vs_ring"
harness = false

# Side-by-side: frozen concrete u32 ("legacy") vs generic Gr128<u32>, same run,
# to confirm the Limb-generic refactor adds no overhead.
[[bench]]
name = "generic_overhead"
harness = false

[[bin]]
name = "find_f2"
path = "src/bin/find_f2.rs"
