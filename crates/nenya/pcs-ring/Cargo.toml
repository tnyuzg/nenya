[package]
name = "pcs-ring"
version = "0.1.0"
edition = "2021"

# Brakedown-style tensor PCS over GR(2^32, 128) using an RAA code.
# See PROTOCOL.md for the design writeup.

[dependencies]
galois-ring = { path = "../galois-ring" }       # GR32_*
piop-ring = { path = "../piop-ring" }            # build_eq_table
reduction = { path = "../reduction" }        # pack_r2 (for basis images v_k)
blake3 = "1.5"
rand = "0.8"
rayon = "1.10"                                   # parallel encode rows + Merkle leaves/levels

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "pcs"
harness = false
