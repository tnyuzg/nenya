[package]
name = "snark-ring"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

# End-to-end Nenya zkSNARKs for the SIMD, MIMD and General models.
# examples/exp_cell.rs and examples/png_filter.rs produce the paper's data.

[dependencies]
galois-ring = { path = "../galois-ring" }
piop-ring = { path = "../piop-ring" }
pcs-ring = { path = "../pcs-ring" }
reduction = { path = "../reduction" }
blake3 = "1.5"
rayon = "1.10"

[dev-dependencies]
# The field baseline, used by the examples for comparison.
snark-field = { path = "../../baseline/snark-field" }
field = { path = "../../baseline/field" }
